<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#475569"/></marker></defs><rect width="1120" height="430" fill="#f8fafc"/><text x="25" y="32" font-family="Arial" font-size="22" font-weight="bold">Version 2: Python validates every action</text><text x="25" y="58" font-family="Arial" font-size="13">Private rules and structured state remain outside generated model output.</text><g><rect x="25" y="110" width="155" height="70" rx="9" fill="#fff" stroke="#334155"/><text x="102" y="137" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Player</text><text x="102" y="159" text-anchor="middle" font-family="Arial" font-size="11">One requested action</text></g><g><rect x="205" y="110" width="155" height="70" rx="9" fill="#fff" stroke="#334155"/><text x="282" y="137" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Streamlit chat</text><text x="282" y="159" text-anchor="middle" font-family="Arial" font-size="11">Input and conversation</text></g><path d="M180,145 L205,145" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="385" y="110" width="155" height="70" rx="9" fill="#fff" stroke="#334155"/><text x="462" y="137" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Gemini interpreter</text><text x="462" y="159" text-anchor="middle" font-family="Arial" font-size="11">JSON action only</text></g><path d="M360,145 L385,145" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="565" y="110" width="155" height="70" rx="9" fill="#fff" stroke="#334155"/><text x="642" y="137" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Python engine</text><text x="642" y="159" text-anchor="middle" font-family="Arial" font-size="11">Validate + update state</text></g><path d="M540,145 L565,145" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="745" y="110" width="155" height="70" rx="9" fill="#fff" stroke="#334155"/><text x="822" y="137" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Gemini narrator</text><text x="822" y="159" text-anchor="middle" font-family="Arial" font-size="11">Select approved outcome</text></g><path d="M720,145 L745,145" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="925" y="110" width="155" height="70" rx="9" fill="#fff" stroke="#334155"/><text x="1002" y="137" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Output guard</text><text x="1002" y="159" text-anchor="middle" font-family="Arial" font-size="11">Approved text or fallback</text></g><path d="M900,145 L925,145" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="450" y="260" width="155" height="70" rx="9" fill="#fff" stroke="#334155"/><text x="527" y="287" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Private rules</text><text x="527" y="309" text-anchor="middle" font-family="Arial" font-size="11">Codes + prerequisites</text></g><g><rect x="650" y="260" width="155" height="70" rx="9" fill="#fff" stroke="#334155"/><text x="727" y="287" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Structured state</text><text x="727" y="309" text-anchor="middle" font-family="Arial" font-size="11">Inventory, puzzles, locks</text></g><path d="M528,260 L600,180" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M720,260 L670,180" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M650,180 L700,260" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M1002,180 L1002,225 L282,225 L282,180" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="25" y="385" font